services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/cicd.db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      CI_DIAGNOSTICS_COLLECTOR_SECRET: ${CI_DIAGNOSTICS_COLLECTOR_SECRET}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    volumes:
      - ./artifacts:/app/artifacts
      - sqlite_data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

# For deployments beyond a demo, replace SQLite and sqlite_data with a managed Postgres service.
volumes:
  sqlite_data:
